<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oferta de Muebles y Electrodomésticos</title>
<meta name="description" content="Catálogo de muebles, electrodomésticos y electrónica de hogar. Precio fijo y trato directo con quien vende.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/src/app.css?v=8">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">Oferta de Muebles y Electrodomésticos</a>
  <a href="/" aria-current="page">Catálogo</a>
  <a href="/mis-conversaciones">Mis conversaciones</a>
  <a href="/admin.html">Administración</a>
</nav>

<main>
  <section class="section-head">
    <div>
      <h1>Catálogo</h1>
      <p class="lead" id="resumen">Cargando…</p>
    </div>
    <div class="tabs" id="filtros"></div>
  </section>
  <div id="grid" class="grid"></div>
  <p id="vacio" class="spinner hide">No hay productos en esta categoría por ahora.</p>
</main>

<script type="module">
import { sb, clp, esc, cargarCategorias, ESTADO, estadoHTML, placeholderSVG, fotoUrl, fotoHTML, fail, aplicarTitulo } from '/src/supabase.js';

aplicarTitulo('');

let CATEGORIAS = [];

const grid = document.getElementById('grid');
const filtros = document.getElementById('filtros');
let cat = new URLSearchParams(location.search).get('cat') || 'Todo';
let verVendidos = true;
let items = [];
let ofertasVisibles = true;

function pintarFiltros() {
  filtros.innerHTML = ['Todo', ...CATEGORIAS]
    .map((c) => `<button type="button" role="tab" aria-selected="${c === cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')
    + `<label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding-left:22px;border-left:1px solid var(--line);padding-bottom:6px;color:var(--muted)">
        <input type="checkbox" id="chk-vendidos" ${verVendidos ? 'checked' : ''}> Mostrar vendidos</label>`;
  filtros.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => { cat = b.dataset.cat; pintarFiltros(); pintar(); });
  filtros.querySelector('#chk-vendidos').onchange = (e) => { verVendidos = e.target.checked; pintar(); };
}

const orden = { disponible: 0, reservado: 1, vendido: 2 };

function pintar() {
  const lista = items
    .filter((p) => (cat === 'Todo' || p.category === cat) && (verVendidos || p.status !== 'vendido'))
    .sort((a, b) => orden[a.status] - orden[b.status] || new Date(b.created_at) - new Date(a.created_at));

  document.getElementById('vacio').classList.toggle('hide', lista.length > 0);
  grid.innerHTML = lista.map((p) => {
    const foto = fotoUrl(p.cover);
    const n = p.interested_count || 0;
    return `<a class="card ${p.status === 'vendido' ? 'sold' : ''}" href="/p/${p.id}">
      <div class="thumb">
        ${foto ? fotoHTML(foto, p.title) : placeholderSVG(p.category)}
        <span class="pill" style="position:absolute;bottom:12px;left:12px;z-index:2;white-space:nowrap;background:#fff;color:#141414;box-shadow:0 1px 3px rgba(0,0,0,.15)"><span class="dot" style="background:${ESTADO[p.status].color}"></span>${ESTADO[p.status].label}</span>
        ${p.photo_count > 1 ? `<span class="pill count" style="position:absolute;bottom:12px;right:12px;z-index:2;background:#fff;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.15)">${p.photo_count} fotos</span>` : ''}
      </div>
      <div class="stack">
        <div class="titles"><span>${esc(p.title)}</span><span class="price">${clp(p.price_clp)}</span></div>
        <div class="meta">${esc(p.category)}</div>
        ${ofertasVisibles && p.accepts_offers !== false && p.top_offer_clp ? `<div class="meta" style="margin-top:4px">Oferta más alta <strong style="color:var(--ink)">${clp(p.top_offer_clp)}</strong> · ${p.offer_count} ${p.offer_count === 1 ? 'oferta' : 'ofertas'}</div>` : ''}
        <div class="meta" style="color:var(--accent);font-weight:600;margin-top:4px;line-height:1.4">${n === 0 ? 'Sin interesados aún' : n === 1 ? '1 persona interesada' : n + ' personas interesadas'}</div>
      </div>
    </a>`;
  }).join('');
}

async function cargar() {
  grid.innerHTML = '<p class="spinner">Cargando catálogo…</p>';
  CATEGORIAS = await cargarCategorias();
  if (cat !== 'Todo' && !CATEGORIAS.includes(cat)) cat = 'Todo';
  pintarFiltros();
  const { data, error } = await sb.from('catalog').select('*').order('created_at', { ascending: false });
  if (error) { grid.innerHTML = ''; return fail(error); }
  const { data: st } = await sb.from('site_settings').select('key,value');
  const aj = Object.fromEntries((st || []).map((r) => [r.key, r.value === true]));
  ofertasVisibles = aj.ofertas_publicas ?? true;

  const ids = data.map((p) => p.id);
  const fotos = ids.length
    ? (await sb.from('product_photos').select('product_id,storage_path,position').in('product_id', ids).order('position')).data || []
    : [];
  items = data.map((p) => {
    const f = fotos.filter((x) => x.product_id === p.id);
    return { ...p, cover: f[0]?.storage_path, photo_count: f.length };
  });

  document.getElementById('resumen').textContent =
    `${items.length} ${items.length === 1 ? 'producto' : 'productos'} · ${ofertasVisibles ? 'precio publicado, ofertas abiertas' : 'precio fijo'}, trato directo con quien vende`;
  pintar();
}

cargar();

sb.channel('catalogo')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, cargar)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, cargar)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'offers' }, cargar)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'site_settings' }, () => { cargar(); aplicarTitulo(''); })
  .subscribe();
</script>
</body>
</html>

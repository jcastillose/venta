<!DOCTYPE html>
<html lang="es" data-version="18">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobVenta — Venta de muebles por cambio de casa</title>
<meta name="description" content="Catálogo de muebles, electrodomésticos y electrónica de hogar. Precio fijo y trato directo con quien vende.">
<link rel="icon" type="image/png" href="/src/favicon.png">
<link rel="apple-touch-icon" href="/src/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MobVenta">
<meta property="og:title" content="MobVenta — Venta de muebles por cambio de casa">
<meta property="og:description" content="Venta de muebles, electrodomésticos y electrónica por cambio de casa. Precio publicado y trato directo con quien vende.">
<meta property="og:image" content="https://mobventa.netlify.app/marca/logo.png">
<meta property="og:image:width" content="900">
<meta property="og:image:height" content="450">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mobventa.netlify.app/marca/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://bxsldfwlbagvgxxhtfwc.supabase.co">
<link rel="modulepreload" href="/src/vendor/supabase-js-2.45.4.js">
<link rel="modulepreload" href="/src/supabase.js">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="/src/app.css?v=17">
<script defer src="/src/sentry.js"></script>
<script defer src="https://js-de.sentry-cdn.com/eb8b8ac82e5eef0fc305cb9a2da4a622.min.js" crossorigin="anonymous"></script>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/" aria-label="MobVenta, ir al catálogo"><img src="/marca/logo.png" width="900" height="450" fetchpriority="high" decoding="async" alt="MobVenta — Venta de muebles por cambio de casa"></a>
  <a href="/" aria-current="page">Catálogo</a>
  <a href="/mis-conversaciones">Mis conversaciones</a>
  <a href="/admin.html">Administración</a>
</nav>

<main>
  <section class="section-head">
    <div>
      <h1>Catálogo</h1>
      <p class="lead" id="resumen">Cargando…</p>
    </div>
    <div class="tabs" id="filtros"></div>
  </section>
  <div id="grid" class="grid"></div>
  <p id="vacio" class="spinner hide">No hay productos en esta categoría por ahora.</p>
</main>

<script type="module">
import { sb, clp, esc, cargarCategorias, ESTADO, estadoHTML, placeholderSVG, fotoUrl, fotoHTML, fail, aplicarTitulo, ajustesSitio } from '/src/supabase.js';
import { registrar } from '/src/visitas.js';

aplicarTitulo('');

let CATEGORIAS = [];

const grid = document.getElementById('grid');
const filtros = document.getElementById('filtros');
let cat = new URLSearchParams(location.search).get('cat') || 'Todo';
let verVendidos = true;
let items = [];
let ofertasVisibles = true;

function pintarFiltros() {
  filtros.innerHTML = ['Todo', ...CATEGORIAS]
    .map((c) => `<button type="button" role="tab" aria-selected="${c === cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')
    + `<label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding-left:22px;border-left:1px solid var(--line);padding-bottom:6px;color:var(--muted)">
        <input type="checkbox" id="chk-vendidos" ${verVendidos ? 'checked' : ''}> Mostrar vendidos</label>`;
  filtros.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => { cat = b.dataset.cat; pintarFiltros(); pintar(); if (cat !== 'Todo') registrar('categoria', { category: cat }); });
  filtros.querySelector('#chk-vendidos').onchange = (e) => { verVendidos = e.target.checked; pintar(); };
}

const orden = { disponible: 0, reservado: 1, vendido: 2 };

function pintar() {
  const lista = items
    .filter((p) => (cat === 'Todo' || p.category === cat) && (verVendidos || p.status !== 'vendido'))
    .sort((a, b) => orden[a.status] - orden[b.status] || b.ts - a.ts);

  document.getElementById('vacio').classList.toggle('hide', lista.length > 0);
  grid.innerHTML = lista.map((p, i) => {
    const foto = fotoUrl(p.cover);
    const alta = i < 4;   // primeras tarjetas: visibles al cargar, sin lazy y con prioridad
    const n = p.interested_count || 0;
    return `<a class="card ${p.status === 'vendido' ? 'sold' : ''}" href="/p/${p.id}">
      <div class="thumb">
        ${foto ? fotoHTML(foto, p.title, true, alta) : placeholderSVG(p.category)}
        <span class="pill" style="position:absolute;bottom:12px;left:12px;z-index:2;white-space:nowrap;background:#fff;color:#141414;box-shadow:0 1px 3px rgba(0,0,0,.15)"><span class="dot" style="background:${ESTADO[p.status].color}"></span>${ESTADO[p.status].label}</span>
        ${p.photo_count > 1 ? `<span class="pill count" style="position:absolute;bottom:12px;right:12px;z-index:2;background:#fff;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.15)">${p.photo_count} fotos</span>` : ''}
      </div>
      <div class="stack">
        <div class="titles"><span>${esc(p.title)}</span><span class="price">${clp(p.price_clp)}</span></div>
        <div class="meta">${esc(p.category)}</div>
        ${ofertasVisibles && p.accepts_offers !== false && p.top_offer_clp ? `<div class="meta" style="margin-top:4px">Oferta más alta <strong style="color:var(--ink)">${clp(p.top_offer_clp)}</strong> · ${p.offer_count} ${p.offer_count === 1 ? 'oferta' : 'ofertas'}</div>` : ''}
        <div class="meta" style="color:var(--accent);font-weight:600;margin-top:4px;line-height:1.4">${n === 0 ? 'Sin interesados aún' : n === 1 ? '1 persona interesada' : n + ' personas interesadas'}</div>
      </div>
    </a>`;
  }).join('');
}

// Solo las columnas que usa la tarjeta; portada, miniatura y nº de fotos ya vienen de la vista.
const COLS_TARJETA = 'id,title,category,price_clp,status,created_at,accepts_offers,top_offer_clp,offer_count,interested_count,cover,cover_thumb,photo_count';
const PAGINA = 200;   // PostgREST corta en 1000 filas; si el catálogo crece, aquí va la paginación

async function cargar() {
  grid.innerHTML = '<p class="spinner">Cargando catálogo…</p>';
  const [cats, { data, error }, st] = await Promise.all([
    cargarCategorias(),
    sb.from('catalog').select(COLS_TARJETA).order('status').order('created_at', { ascending: false }).range(0, PAGINA - 1),
    ajustesSitio(),
  ]);
  CATEGORIAS = cats;
  if (cat !== 'Todo' && !CATEGORIAS.includes(cat)) cat = 'Todo';
  pintarFiltros();
  if (error) { grid.innerHTML = ''; return fail(error); }
  ofertasVisibles = Object.fromEntries(st.map((r) => [r.key, r.value === true])).ofertas_publicas ?? true;
  items = data.map((p) => ({ ...p, ts: Date.parse(p.created_at), cover: p.cover_thumb || p.cover }));

  document.getElementById('resumen').textContent =
    `${items.length} ${items.length === 1 ? 'producto' : 'productos'} · ${ofertasVisibles ? 'precio publicado, ofertas abiertas' : 'precio fijo'}, trato directo con quien vende`;
  pintar();
}

cargar();
registrar('catalogo');

// Sin websocket para visitantes anónimos: cada conexión Realtime cuenta contra el límite del plan
// (200 simultáneas en el gratuito) y cualquier cambio obligaba a TODOS los visitantes a recargar
// el catálogo a la vez. Basta con refrescar al volver a la pestaña si pasó más de un minuto.
let ultimaCarga = Date.now();
const cargarYMarcar = () => { ultimaCarga = Date.now(); return cargar(); };
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - ultimaCarga > 60_000) cargarYMarcar();
});
</script>
</body>
</html>

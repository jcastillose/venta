<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<nav class="nav">

  <span id="nav-tabs" class="hide" style="display:flex;gap:28px"></span>
  <span id="nav-me" class="hide" style="margin-left:auto;display:flex;gap:14px;align-items:center;color:var(--muted)"></span>

<main id="view"><p class="spinner">Cargando…</p></main>

<dialog id="dlg-cuenta">
  <form class="sheet" id="form-cuenta">

    <input type="hidden" name="id">
    <label class="field">Nombre<input name="name" required placeholder="Ej. Rocío Soto"></label>

    <label class="field">Rol<select name="role">
      <option value="editor">Editor · productos y conversaciones</option>
      <option value="admin">Administrador · también cuentas y cobros</option>
    </select></label>
    <div id="cuenta-modo" class="stack" style="gap:10px">
      <label class="choice"><span class="head"><input type="radio" name="modo" value="password" checked><span class="mark"></span>
        <span class="stack"><b>Con contraseña inicial</b><span class="desc">Queda lista para entrar hoy. Tú le comunicas la contraseña y la cambia en Mi cuenta.</span></span></span></label>
      <label class="choice"><span class="head"><input type="radio" name="modo" value="invitar"><span class="mark"></span>
        <span class="stack"><b>Invitación por correo</b><span class="desc">Recibe un enlace que abre el panel y activa la cuenta. Sirve una vez, caduca en una hora y debe abrirse en el navegador donde va a trabajar.</span></span></span></label>
    </div>
    <label class="field" id="cuenta-pass-wrap">Contraseña inicial<input name="password" type="text" minlength="8" autocomplete="off" placeholder="Mínimo 8 caracteres"><span class="hint" id="cuenta-pass-hint">Puedes dejarla vacía para no cambiarla.</span></label>
    <div class="actions">
      <button type="button" class="btn btn-secondary" data-close>Cancelar</button>

</dialog>

<dialog id="dlg-ofertas">
  <form class="sheet" method="dialog" id="form-ofertas">
    <div class="title" id="ofertas-titulo"></div>
    <p id="ofertas-texto"></p>
    <div class="actions">
      <button type="button" class="btn btn-secondary" data-close>Cancelar</button>

</dialog>

<dialog id="dlg-eliminar">
  <form class="sheet" method="dialog" id="form-eliminar">
    <div class="title">Eliminar cuenta</div>
    <p id="eliminar-texto"></p>
    <div class="actions">
      <button type="button" class="btn btn-secondary" data-close>Cancelar</button>
      <button type="submit" class="btn btn-primary" style="background:var(--rojo)">Eliminar</button>
    </div>

</dialog>

<script type="module">
import { sb, SITE_URL, clp, esc, fecha, hora, cargarCategorias, CONDICIONES, condicionLabel, METODOS, ESTADO, ESTADO_INTERES, ESTADO_PAGO,
         estadoHTML, fotoUrl, fotoHTML, fail, toast, ICON, aplicarTitulo, TITULO_BASE, SUPABASE_URL } from '/src/supabase.js';

let tituloActual = TITULO_BASE;
aplicarTitulo('Administración').then((t) => { tituloActual = t; });

let CATEGORIAS = [];

const view = document.getElementById('view');
let me = null, vista = 'productos', ctx = {};
let productos = [], fotosPorProducto = {}, intereses = [], pagos = [], cobroCfg = [], equipo = [], ofertas = [], ajustes = { ofertas_habilitadas: true, ofertas_publicas: true };

/* ── sesión ─────────────────────────────────────────────────────── */
/* Supabase devuelve los errores del enlace en la URL: #error=access_denied&error_code=otp_expired… */
function errorDeEnlace() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const q = new URLSearchParams(location.search);
  const code = h.get('error_code') || q.get('error_code') || '';
  const desc = h.get('error_description') || q.get('error_description') || '';
  if (!code && !desc) return null;
  history.replaceState(null, '', '/admin.html');
  if (/expired/i.test(code + desc)) return 'El enlace caducó o ya fue usado: dura una hora y sirve una sola vez. Pide uno nuevo con “Enlace por correo”.';
  return 'El enlace no es válido. Pide uno nuevo con “Enlace por correo” desde este mismo navegador. (' + esc(decodeURIComponent((desc || code).replace(/\+/g, ' '))) + ')';
}
const traeToken = () => /access_token=|code=|type=/.test(location.hash + location.search);

async function init() {
  const aviso = errorDeEnlace();
  let { data: { session } } = await sb.auth.getSession();
  if (!session && traeToken()) {
    // La librería está canjeando el enlace; onAuthStateChange(SIGNED_IN) volverá a llamar a init().
    view.innerHTML = '<p class="spinner">Validando el enlace…</p>';
    return;
  }
  if (!session) return login(aviso);
  if (traeToken()) history.replaceState(null, '', '/admin.html');
  view.innerHTML = '<p class="spinner">Entrando…</p>';
  let { data, error } = await sb.from('members').select('*').eq('id', session.user.id).single();
  if (error && error.code !== 'PGRST116') return errorAcceso(session.user.email, error);
  if (!data) return sinCuenta(session.user.email);
  if (data.status === 'invitado') {
    // Primer ingreso con el enlace de invitación: la cuenta se activa sola.
    const { data: st, error: e2 } = await sb.rpc('activar_invitacion');
    if (e2) return errorAcceso(session.user.email, e2);
    data.status = st || 'activo';
    toast('Bienvenido/a. Crea tu contraseña en Mi cuenta para no depender del correo.');
  }
  if (data.status !== 'activo') return suspendida(data);
  me = data;
  sb.from('members').update({ last_seen: new Date().toISOString() }).eq('id', me.id).then(() => {});
  navegar();
  try {
    await cargar();
  } catch (e) {
    console.error(e);
    fail(new Error('No se pudo cargar toda la información: ' + (e.message || e)));
  }
  render();
}

let modoLogin = localStorage.getItem('vh.modoLogin') || 'password';

function login(aviso) {
  document.getElementById('nav-tabs').classList.add('hide');
  document.getElementById('nav-me').classList.add('hide');
  const pass = modoLogin === 'password';
  view.innerHTML = `<section class="center">
    <div class="panel" style="width:min(420px,100%);padding:32px;gap:16px">
      ${aviso ? `<div class="note note-warn">${aviso}</div>` : ''}
      <div class="icon-box" style="width:40px;height:40px;border-radius:8px;background:var(--accent-wash);display:grid;place-items:center;color:var(--accent)">${ICON.login}</div>
      <h2 style="font-size:26px">Acceso equipo</h2>
      <div class="tabs" style="gap:18px">
        <button type="button" role="tab" aria-selected="${pass}" data-modo="password">Contraseña</button>
        <button type="button" role="tab" aria-selected="${!pass}" data-modo="link">Enlace por correo</button>
      </div>
      <form id="form-login" class="form" style="gap:16px">
        <label class="field">Correo<input name="email" type="email" required autocomplete="email" value="${esc(localStorage.getItem('vh.email') || '')}"></label>
        ${pass ? `<label class="field">Contraseña<input name="password" type="password" required autocomplete="current-password" minlength="8"></label>` : ''}
        <button class="btn btn-primary btn-block">${pass ? 'Entrar' : 'Enviarme el enlace'}</button>
      </form>
      <p class="lead" style="font-size:12.5px">${pass
        ? 'La contraseña la creas tú desde <strong>Mi cuenta</strong> la primera vez que entras. Si aún no tienes una, usa el enlace por correo.'
        : 'Te enviamos un enlace de acceso al correo de tu cuenta. Ábrelo en <strong>este mismo navegador</strong>; sirve una vez y caduca en una hora.'}</p>
      ${pass ? `<button type="button" class="btn btn-ghost" id="olvide" style="font-size:12.5px;justify-self:start">Olvidé mi contraseña</button>` : ''}
      <div id="login-msg"></div>
    </div>
  </section>`;

  view.querySelectorAll('[data-modo]').forEach((b) => b.onclick = () => {
    modoLogin = b.dataset.modo;
    localStorage.setItem('vh.modoLogin', modoLogin);
    login();
  });

  const form = document.getElementById('form-login');
  const msg = document.getElementById('login-msg');

  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const email = fd.get('email').trim();
    localStorage.setItem('vh.email', email);
    const btn = form.querySelector('button');
    btn.disabled = true;

    if (modoLogin === 'password') {
      const { error } = await sb.auth.signInWithPassword({ email, password: fd.get('password') });
      btn.disabled = false;
      if (error) {
        msg.innerHTML = `<div class="note note-warn">Correo o contraseña incorrectos. Si nunca creaste una contraseña, entra con el enlace por correo y créala en <strong>Mi cuenta</strong>.</div>`;
        return;
      }
      me = null;
      return init();
    }

    // shouldCreateUser:false → solo correos que ya tienen cuenta (creada desde Equipo).
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: SITE_URL + '/admin.html', shouldCreateUser: false } });
    btn.disabled = false;
    if (error) {
      msg.innerHTML = `<div class="note note-warn">${/not allowed|signups|not found/i.test(error.message)
        ? 'Ese correo no tiene cuenta en el equipo. Pídele a un administrador que la cree en <strong>Equipo → Nueva cuenta</strong>.'
        : esc(error.message) + (/rate/i.test(error.message) ? ' — espera una hora o entra con contraseña.' : '')}</div>`;
      return;
    }
    msg.innerHTML = `<div class="note note-ok">Listo. Revisa <strong>${esc(email)}</strong> y abre el enlace para entrar.</div>`;
  };

  document.getElementById('olvide')?.addEventListener('click', async () => {
    const email = (form.email.value || '').trim();
    if (!email) { form.email.focus(); return toast('Escribe tu correo primero'); }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL + '/admin.html' });
    if (error) return fail(error);
    msg.innerHTML = `<div class="note note-ok">Te enviamos un correo para crear una contraseña nueva.</div>`;
  });
}

/* Pantalla que aparece al volver del correo de recuperación. */
function recuperar() {
  document.getElementById('nav-tabs').classList.add('hide');
  view.innerHTML = `<section class="center">
    <form class="panel" id="form-nueva" style="width:min(420px,100%);padding:32px;gap:16px">
      <h2 style="font-size:26px">Crea tu contraseña</h2>
      <p class="lead">Elige una de al menos 8 caracteres. Con ella entrarás sin depender del correo.</p>
      <label class="field">Contraseña nueva<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <label class="field">Repítela<input name="password2" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn btn-primary btn-block">Guardar contraseña</button>
    </form>
  </section>`;
  document.getElementById('form-nueva').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (fd.get('password') !== fd.get('password2')) return toast('Las contraseñas no coinciden');
    const { error } = await sb.auth.updateUser({ password: fd.get('password') });
    if (error) return fail(error);
    modoLogin = 'password';
    localStorage.setItem('vh.modoLogin', 'password');
    toast('Contraseña guardada');
    history.replaceState(null, '', '/admin.html');
    me = null;
    init();
  };
}

const salir = async () => {
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) { console.warn(e); }
  // Respaldo: borrar cualquier sesión que haya quedado guardada.
  Object.keys(localStorage).filter((k) => k.startsWith('sb-') && k.endsWith('-auth-token')).forEach((k) => localStorage.removeItem(k));
  me = null;
  location.replace('/admin.html');
};

function errorAcceso(email, error) {
  view.innerHTML = `<section class="center"><div class="panel" style="max-width:520px;padding:28px">
    <h3>No pudimos leer tu cuenta</h3>
    <p class="lead">${esc(email)} inició sesión, pero la consulta a la base de datos falló.</p>
    <div class="note note-warn" style="font-size:13px"><strong>${esc(error.code || 'error')}</strong> — ${esc(error.message || '')}${error.hint ? '<br>' + esc(error.hint) : ''}</div>
    <p class="lead" style="font-size:12.5px">Si dice <em>permission denied</em>, falta ejecutar los <code>grant</code> del esquema en Supabase.</p>
    <div><button class="btn btn-secondary" id="salir">Salir</button></div></div></section>`;
  document.getElementById('salir').onclick = salir;
}

function sinCuenta(email) {
  view.innerHTML = `<section class="center"><div class="panel" style="max-width:460px;padding:28px">
    <h3>Tu correo no tiene cuenta en el equipo</h3>
    <p class="lead">${esc(email)} entró correctamente, pero no hay una cuenta asociada. Pídele a un administrador que la cree en <strong>Equipo → Nueva cuenta</strong> con este mismo correo; si es la primera cuenta del sitio, corre <code>bootstrap-admin.sql</code>.</p>
    <div><button class="btn btn-secondary" id="salir">Salir</button></div></div></section>`;
  document.getElementById('salir').onclick = salir;
}
function suspendida(m) {
  view.innerHTML = `<section class="center"><div class="panel" style="max-width:460px;padding:28px">
    <h3>Cuenta ${esc(m.status)}</h3>
    <p class="lead">Tu acceso está ${esc(m.status)}. Un administrador puede reactivarlo desde la pantalla Equipo.</p>
    <div><button class="btn btn-secondary" id="salir">Salir</button></div></div></section>`;
  document.getElementById('salir').onclick = salir;
}

function navegar() {
  const tabs = [['productos', 'Productos'], ['interesados', 'Interesados'], ['cobros', 'Cobros'], ['equipo', 'Equipo'], ['ajustes', 'Ajustes'], ['cuenta', 'Mi cuenta']];
  const nav = document.getElementById('nav-tabs');
  nav.classList.remove('hide');
  nav.innerHTML = tabs.map(([k, l]) => {
    const badge = k === 'interesados' ? intereses.filter((i) => i.status === 'nuevo').length
      : k === 'cobros' ? pagos.filter((p) => p.status === 'porconfirmar').length : 0;
    return `<a href="#${k}" ${vista === k ? 'aria-current="page"' : ''} data-go="${k}">${l}${badge ? ` <span style="background:${k === 'cobros' ? 'var(--ambar)' : 'var(--accent)'};color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:inline-grid;place-content:center;padding:0 5px">${badge}</span>` : ''}</a>`;
  }).join('');
  nav.querySelectorAll('[data-go]').forEach((a) => a.onclick = (e) => { e.preventDefault(); ir(a.dataset.go); });

  const mine = document.getElementById('nav-me');
  mine.classList.remove('hide');
  mine.innerHTML = `<span style="font-size:12.5px">${esc(me.name)} · ${me.role === 'admin' ? 'Administrador' : 'Editor'}</span>
    <button class="btn btn-secondary" id="btn-salir" style="padding:7px 12px;font-size:12.5px">Salir</button>`;
  document.getElementById('btn-salir').onclick = salir;
}

function ir(v, c = {}) { vista = v; ctx = c; navegar(); render(); window.scrollTo(0, 0); }

/* ── datos ──────────────────────────────────────────────────────── */
async function cargar() {
  const [p, f, i, y, s, m, o, aj] = await Promise.all([
    sb.from('products').select('*').order('created_at', { ascending: false }),
    sb.from('product_photos').select('*').order('position'),
    sb.from('interests').select('*').order('created_at', { ascending: false }),
    sb.from('payments').select('*'),
    sb.from('payment_settings').select('*'),
    sb.from('members').select('*').order('created_at'),
    sb.from('offers').select('*'),
    sb.from('site_settings').select('*'),
  ]);
  if (p.error) { fail(p.error); }
  // Tablas de migraciones posteriores: si faltan, avisar sin bloquear el panel.
  const faltan = [['offers', o], ['site_settings', aj]].filter(([, r]) => r.error && /does not exist|relation|schema cache/i.test(r.error.message)).map(([n]) => n);
  if (faltan.length) fail(new Error(`Falta ejecutar en Supabase la migración que crea: ${faltan.join(', ')} (supabase/002-ofertas.sql y 003-ajustes.sql).`));
  [f, i, y, s, m].forEach((r) => { if (r.error) console.warn(r.error); });
  productos = p.data || [];
  fotosPorProducto = {};
  (f.data || []).forEach((x) => (fotosPorProducto[x.product_id] ||= []).push(x));
  intereses = i.data || []; pagos = y.data || []; cobroCfg = s.data || []; equipo = m.data || []; ofertas = o.data || [];
  ajustes = { ofertas_habilitadas: true, ofertas_publicas: true };
  (aj.data || []).forEach((r) => { ajustes[r.key] = r.value === true; });
  CATEGORIAS = await cargarCategorias();
  navegar();
}
const recargar = async () => { await cargar(); render(); };

const prod = (id) => productos.find((p) => p.id === id);
const pago = (interestId) => pagos.find((p) => p.interest_id === interestId);
const oferta = (interestId) => ofertas.find((o) => o.interest_id === interestId);
const topOferta = (productId) => ofertas.filter((o) => o.product_id === productId).reduce((a, o) => Math.max(a, o.amount_clp), 0);
const nombreDe = (id) => equipo.find((u) => u.id === id)?.name || '—';
const fotos = (id) => fotosPorProducto[id] || [];
const nInteresados = (id) => intereses.filter((i) => i.product_id === id).length;

/* ── router ─────────────────────────────────────────────────────── */
function render() {
  ({ productos: vProductos, editor: vEditor, interesados: vInteresados,
     chat: vChat, cobros: vCobros, equipo: vEquipo, cuenta: vCuenta, ajustes: vAjustes }[vista] || vProductos)();
}

/* ── ajustes ─────────────────────────────────────────────────────── */
function vAjustes() {
  const admin = me.role === 'admin';
  const conOfertas = productos.filter((p) => p.accepts_offers !== false).length;
  const fila = (key, titulo, desc, disabled) => {
    const on = !!ajustes[key];
    return `<div class="panel" style="opacity:${disabled ? .55 : 1}">
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div class="stack" style="flex:1;min-width:220px">
          <strong style="font-size:15px">${titulo}</strong>
          <span class="sub" style="font-size:13px;color:var(--muted);line-height:1.5">${desc}</span>
        </div>
        <span class="state"><span class="dot" style="background:${on ? 'var(--verde)' : 'var(--gris)'}"></span>${on ? 'Activo' : 'Desactivado'}</span>
        ${admin ? `<button class="btn ${on ? 'btn-secondary' : 'btn-primary'}" data-aj="${key}" data-to="${!on}" ${disabled ? 'disabled' : ''}>${on ? 'Desactivar' : 'Activar'}</button>` : ''}
      </div></div>`;
  };
  view.innerHTML = `
    <section class="section-head">
      <div class="stack">
        <span class="kicker">Sitio público</span>
        <h2>Ajustes</h2>
        <p class="lead" style="max-width:60ch">Cambios que aplican a todo el catálogo al instante. ${admin ? '' : 'Solo un administrador puede modificarlos.'}</p>
      </div>
    </section>
    <div style="display:grid;gap:12px;max-width:820px">
      <form class="panel" id="form-titulo">
        <div class="stack"><strong style="font-size:15px">Nombre del sitio</strong><span class="sub" style="font-size:13px;color:var(--muted);line-height:1.5">Aparece en la barra superior de todas las páginas y en el título de la pestaña del navegador.</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input name="titulo" required maxlength="80" value="${esc(tituloActual)}" ${admin ? '' : 'readonly'} aria-label="Nombre del sitio" style="flex:1;min-width:240px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:${admin ? 'var(--surface)' : '#F6F5F1'};font-size:14px;font-weight:600">
          ${admin ? '<button class="btn btn-primary">Guardar</button>' : ''}
        </div>
      </form>
      ${fila('ofertas_habilitadas', 'Permitir ofertas en todos los productos',
        `Interruptor general: al activarlo o desactivarlo se cambia el estado de ofertas de <strong>todos</strong> los productos publicados y queda como valor por defecto para los nuevos. Después puedes ajustar cada producto por separado desde su ficha o desde la lista. Ahora: ${conOfertas} de ${productos.length} ${productos.length === 1 ? 'producto acepta' : 'productos aceptan'} ofertas.`)}
      ${fila('ofertas_publicas', 'Mostrar la oferta más alta en público',
        'Catálogo, detalle y el hilo de cada interesado muestran el monto más alto y cuántas ofertas hay, sin nombres. Desactivado, cada persona solo ve su propia oferta.', !conOfertas)}
    </div>

    <section style="padding:44px 0 16px" class="stack">
      <h3>Categorías</h3>
      <p class="lead" style="max-width:60ch">Son los filtros del catálogo y las opciones del editor. Renombrar una categoría actualiza sus productos; solo se puede eliminar una categoría sin productos.</p>
    </section>
    <div class="tablewrap" style="max-width:820px">
      ${CATEGORIAS.map((c) => {
        const n = productos.filter((p) => p.category === c).length;
        return `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)" data-cat-row="${esc(c)}">
          <div class="stack" style="flex:1;min-width:200px"><strong style="font-size:14.5px">${esc(c)}</strong><span class="sub">${n === 0 ? 'Sin productos' : n === 1 ? '1 producto' : n + ' productos'}</span></div>
          ${admin ? `<div style="display:inline-flex;gap:8px">
            <button class="btn btn-secondary" data-cat-ren="${esc(c)}">Renombrar</button>
            <button class="btn btn-secondary btn-danger" data-cat-del="${esc(c)}" ${n ? 'disabled title="Tiene productos"' : ''} aria-label="Eliminar categoría" style="width:32px;height:32px;padding:0;display:grid;place-items:center">${ICON.trash}</button>
          </div>` : ''}
        </div>`; }).join('')}
      ${admin ? `<form id="form-cat" style="display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--bg)">

/* Redimensiona la foto en el navegador antes de subirla: lado mayor ≤ FOTO_MAX px, JPEG al 86 %,
   orientación EXIF aplicada. Así todas pesan poco (≈200–400 KB) y cargan rápido en el catálogo.
   Devuelve null si el navegador no puede leer el archivo (p. ej. HEIC de iPhone en Chrome). */
const FOTO_MAX = 1600;
async function optimizarFoto(file) {
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(file.name)) return null;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { return /image\/(jpeg|png|webp|gif)/.test(file.type) ? file : null; }
  try {
    const k = Math.min(1, FOTO_MAX / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    bmp.close();
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.86));
    if (!blob) return file;
    // Si ya era pequeña y el JPEG no ahorra nada, se sube tal cual.
    if (k === 1 && blob.size >= file.size && /image\/(jpeg|png|webp)/.test(file.type)) return file;
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}

/* ── chat del equipo ────────────────────────────────────────────── */
async function vChat() {
  const i = intereses.find((x) => x.id === ctx.interestId);
  if (!i) return ir('interesados');
  const p = prod(i.product_id) || {};
  const y = pago(i.id);
  const { data: ms } = await sb.from('messages').select('*').eq('interest_id', i.id).order('created_at');
  const f = fotoUrl(fotos(i.product_id)[0]?.storage_path);
  const metodo = y ? (METODOS[y.method] || y.method) : null;
  const ref = y?.reference ? ` · ref. ${esc(y.reference)}` : '';

  let franja = '';
  if (y?.status === 'pagado') {
    franja = nota('note-ok', 'var(--verde)', 'Pago confirmado',
      `${clp(y.amount_clp)} por ${esc(metodo)}${ref}. Confirmado ${fecha(y.confirmed_at)}`);
  } else if (y?.status === 'porconfirmar') {
    franja = nota('note-warn', 'var(--ambar)', 'Pago por confirmar',
      `${esc(i.buyer_name.split(' ')[0])} avisó un pago de ${clp(y.amount_clp)} por ${esc(metodo)}${ref} (${fecha(y.declared_at)}).`,
      `<button class="btn btn-primary" id="btn-confirmar">${ICON.check}Confirmar pago recibido</button>`);
  } else if (i.status === 'reservado') {
    franja = nota('note-warn', 'var(--ambar)', 'Pago pendiente',
      `${esc(i.buyer_name.split(' ')[0])} ya puede pagar desde su enlace privado. Los datos de cobro se muestran ahí.`);
  }

  const acciones = (i.status !== 'vendido' && p.status !== 'vendido')
    ? `<div style="max-width:780px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 2px">
        <span class="lead" style="margin-right:auto">Cerrar el trato con ${esc(i.buyer_name)}:</span>
        ${i.status !== 'reservado' ? `<button class="btn btn-secondary" id="btn-reservar">Reservar</button>` : ''}
        <button class="btn btn-primary" id="btn-vender">${ICON.check}Marcar vendido</button>
      </div>` : '';

  view.innerHTML = `
    <div style="padding-top:20px"><button class="btn btn-ghost" id="volver">${ICON.back}${ctx.back === 'cobros' ? 'Cobros' : 'Interesados'}</button></div>
    <section class="chat" style="margin-top:16px">
      <header>
        ${f ? `<img class="mini" src="${f}" alt="">` : '<div class="mini"></div>'}
        <div style="flex:1;min-width:160px">
          <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">${esc(p.title || '')}</div>
          <div class="sub">${esc(i.buyer_name)} · ${esc(i.buyer_contact)} · ${oferta(i.id) ? `ofrece <strong>${clp(oferta(i.id).amount_clp)}</strong> (precio ${clp(p.price_clp)})` : `precio publicado ${clp(p.price_clp)}`}</div>
        </div>
        ${estadoHTML(ESTADO_INTERES, i.status)}
      </header>
      <div class="log" id="log">
        <p class="sys">Conversación privada con ${esc(i.buyer_name)} sobre este producto.</p>
        ${(ms || []).map((m) => `<div class="msg ${m.sender === 'vendedor' ? 'mine' : ''}">
          <div class="bubble">${esc(m.body)}</div>
          <span class="when">${m.sender === 'vendedor' ? esc(nombreDe(p.created_by).split(' ')[0]) : esc(i.buyer_name.split(' ')[0])} · ${hora(m.created_at)}</span>
        </div>`).join('')}
      </div>
      <form id="form-msg"><input name="body" placeholder="Escribe un mensaje…" aria-label="Mensaje" autocomplete="off" required>
        <button type="submit" aria-label="Enviar">${ICON.send}</button></form>
    </section>
    ${franja}${acciones}
    <p class="lead" style="max-width:780px;margin-top:14px;font-size:12.5px">Enlace privado de esta persona: <code>${esc(location.origin)}/c/${esc(i.token)}</code></p>`;

  document.getElementById('volver').onclick = () => ir(ctx.back || 'interesados');
  const log = document.getElementById('log'); log.scrollTop = log.scrollHeight;

  document.getElementById('form-msg').onsubmit = async (e) => {
    e.preventDefault();
    const input = e.target.body, body = input.value.trim();
    if (!body) return;
    input.value = '';
    const { error } = await sb.from('messages').insert({ interest_id: i.id, sender: 'vendedor', body });
    if (error) return fail(error);
    if (i.status === 'nuevo') await sb.from('interests').update({ status: 'conversando' }).eq('id', i.id);
    await cargar(); render();

    const { error } = await sb.rpc('close_deal', { p_interest: i.id, p_status: 'reservado' });
    if (error) return fail(error);
    toast('Reservado'); await cargar(); render();

    if (error) return fail(error);
    toast('Marcado como vendido'); await cargar(); render();
  });
  document.getElementById('btn-confirmar')?.addEventListener('click', async () => {
    const { error } = await sb.rpc('confirm_payment', { p_interest: i.id });

    toast('Pago confirmado. Producto vendido.'); await cargar(); render();
  });
}

/* Diálogo de crear / editar cuenta. */
function abrirCuenta(u) {
  const dlg = document.getElementById('dlg-cuenta');
  const f = document.getElementById('form-cuenta');
  f.reset();
  f.id.value = u?.id || '';
  f.name.value = u?.name || '';
  f.email.value = u?.email || '';
  f.role.value = u?.role || 'editor';
  document.getElementById('cuenta-titulo').textContent = u ? 'Editar cuenta' : 'Nueva cuenta';
  document.getElementById('cuenta-bajada').textContent = u
    ? 'Cambia nombre, correo o rol. Si escribes una contraseña, reemplaza la actual.'
    : 'La persona podrá publicar y editar todos los productos del equipo.';
  document.getElementById('cuenta-modo').classList.toggle('hide', !!u);
  document.getElementById('cuenta-pass-hint').classList.toggle('hide', !u);
  document.getElementById('cuenta-cta').textContent = u ? 'Guardar cambios' : 'Crear cuenta';
  f.password.required = !u;
  f.querySelectorAll('[name=modo]').forEach((r) => r.onchange = () => {
    const inv = f.modo.value === 'invitar';
    document.getElementById('cuenta-pass-wrap').classList.toggle('hide', inv);
    f.password.required = !inv;
  });
  document.getElementById('cuenta-pass-wrap').classList.remove('hide');
  dlg.showModal();
}

async function vCuenta() {
  const { data: { user } } = await sb.auth.getUser();
  const tienePass = !!user?.user_metadata?.tiene_password;

  view.innerHTML = `
    <section class="section-head">
      <div class="stack">
        <span class="kicker">${esc(me.email)}</span>
        <h2>Mi cuenta</h2>
        <p class="lead" style="max-width:60ch">Crea una contraseña para entrar sin esperar el correo. Puedes cambiarla cuando quieras; el enlace por correo sigue funcionando igual.</p>
      </div>
    </section>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;max-width:900px">
      <form class="panel" id="form-pass">
        <div class="stack">
          <strong style="font-size:15px">${tienePass ? 'Cambiar contraseña' : 'Crear contraseña'}</strong>
          <span class="sub" style="font-size:12.5px;color:var(--muted)">Mínimo 8 caracteres.</span>
        </div>
        <label class="field">Contraseña${tienePass ? ' nueva' : ''}<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <label class="field">Repítela<input name="password2" type="password" required minlength="8" autocomplete="new-password"></label>
        <div><button class="btn btn-primary">${tienePass ? 'Guardar cambio' : 'Crear contraseña'}</button></div>
      </form>
      <form class="panel" id="form-nombre">
        <div class="stack">
          <strong style="font-size:15px">Mi nombre</strong>
          <span class="sub" style="font-size:12.5px;color:var(--muted)">Es el nombre que ven los interesados en el catálogo y en el chat.</span>
        </div>
        <label class="field">Nombre<input name="name" required value="${esc(me.name)}"></label>
        <label class="field">Rol<input value="${me.role === 'admin' ? 'Administrador' : 'Editor'}" readonly style="background:#F6F5F1"></label>
        <div><button class="btn btn-primary">Guardar nombre</button></div>
      </form>
    </div>`;

  document.getElementById('form-pass').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (fd.get('password') !== fd.get('password2')) return toast('Las contraseñas no coinciden');
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    const { error } = await sb.auth.updateUser({
      password: fd.get('password'),
      data: { tiene_password: true },
    });
    btn.disabled = false;
    if (error) return fail(error);
    localStorage.setItem('vh.modoLogin', 'password');
    localStorage.setItem('vh.email', me.email);
    modoLogin = 'password';
    toast(tienePass ? 'Contraseña actualizada' : 'Contraseña creada. Ya puedes entrar con ella.');
    render();
  };

  document.getElementById('form-nombre').onsubmit = async (e) => {
    e.preventDefault();
    const name = new FormData(e.target).get('name').trim();
    if (!name) return;
    const { error } = await sb.from('members').update({ name }).eq('id', me.id);
    if (error) return fail(error);
    me.name = name;
    await cargar();
    navegar();
    toast('Nombre actualizado');
  };
}

/* ── cuentas: llamada a la function con la sesión del administrador ── */
async function llamarCuentas(body) {
  // Refresca el token antes de llamar: uno vencido produce "Sesión inválida".
  let { data: { session } } = await sb.auth.getSession();
  if (!session || (session.expires_at || 0) * 1000 - Date.now() < 60_000) {
    const { data } = await sb.auth.refreshSession();
    session = data.session || session;
  }
  if (!session) { fail(new Error('Tu sesión venció. Recarga el panel y vuelve a entrar.')); return null; }
  try {
    const res = await fetch('/.netlify/functions/cuentas', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + session.access_token, 'x-supabase-url': SUPABASE_URL },
      body: JSON.stringify(body),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || `Error ${res.status}`);
    return out;
  } catch (err) {
    if (/Failed to fetch|404/.test(err.message)) {
      fail(new Error('La función de cuentas no responde. Revisa que SUPABASE_SERVICE_ROLE_KEY esté configurada en Netlify y el sitio redesplegado.'));
    } else fail(err);
    return null;
  }
}

const dlgCuenta = document.getElementById('dlg-cuenta');
const dlgEliminar = document.getElementById('dlg-eliminar');
const dlgOfertas = document.getElementById('dlg-ofertas');
dlgOfertas.querySelector('[data-close]').onclick = () => dlgOfertas.close();
dlgCuenta.querySelector('[data-close]').onclick = () => dlgCuenta.close();
dlgEliminar.querySelector('[data-close]').onclick = () => dlgEliminar.close();

document.getElementById('form-cuenta').onsubmit = async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled = true;
  const editando = !!fd.id;
  const body = editando
    ? { accion: 'editar', id: fd.id, name: fd.name, email: fd.email, role: fd.role, password: fd.password || undefined }
    : { accion: 'crear', name: fd.name, email: fd.email, role: fd.role, modo: fd.modo, password: fd.password };
  const r = await llamarCuentas(body);
  btn.disabled = false;
  if (!r) return;
  dlgCuenta.close();
  toast(editando ? 'Cuenta actualizada' : r.modo === 'invitar' ? 'Invitación enviada a ' + fd.email : 'Cuenta creada. Comunícale la contraseña a ' + fd.name);
  recargar();
};

let recuperando = false;
sb.auth.onAuthStateChange((evt) => {
  if (evt === 'PASSWORD_RECOVERY') { recuperando = true; return recuperar(); }
  if ((evt === 'SIGNED_IN' || evt === 'INITIAL_SESSION') && !me && !recuperando) init();
});

if (/type=recovery/.test(location.hash)) recuperando = true;
if (!recuperando) init();
</script>
</body>
</html>

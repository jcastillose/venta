[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hilo privado de cada interesado: /c/<token>
[[redirects]]
  from = "/c/*"
  to = "/c.html"
  status = 200

# Recuperar conversaciones por correo
[[redirects]]
  from = "/mis-conversaciones"
  to = "/mis-conversaciones.html"
  status = 200

# Detalle de producto: /p/<id>
[[redirects]]
  from = "/p/*"
  to = "/producto.html"
  status = 200

[functions]
  directory = "netlify/functions"

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto — Oferta de Muebles y Electrodomésticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/src/app.css?v=13">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">Oferta de Muebles y Electrodomésticos</a>
  <a href="/">Catálogo</a>
  <a href="/mis-conversaciones">Mis conversaciones</a>
  <a href="/admin.html">Administración</a>
</nav>

<main>
  <div style="padding-top:20px"><a class="btn btn-ghost" href="/" id="volver">Catálogo</a></div>
  <div id="detalle"><p class="spinner">Cargando producto…</p></div>
</main>

<dialog id="dlg-interes">
  <form class="sheet" id="form-interes">
    <div class="title" id="dlg-titulo">Me interesa</div>
    <p id="dlg-bajada"></p>
    <label class="field">Tu nombre<input name="nombre" required autocomplete="name"></label>
    <label class="field">Correo o WhatsApp<input name="contacto" required placeholder="+56 9 … o tu@correo.cl"></label>
    <label class="field">Tu oferta (opcional)<input name="oferta" type="number" min="1000" step="1000" inputmode="numeric" placeholder="Ej. 150000"><span class="hint" id="oferta-hint">Precio publicado y oferta más alta abajo. Si dejas esto vacío, pides el producto al precio publicado.</span></label>
    <label class="field">Mensaje (opcional)<textarea name="mensaje" rows="3" placeholder="¿Cuándo podrías retirar? ¿Alguna duda?"></textarea></label>
    <div class="actions">
      <button type="button" class="btn btn-secondary" id="cancelar">Cancelar</button>
      <button type="submit" class="btn btn-primary">Marcar interés</button>
    </div>
  </form>
</dialog>

<script type="module">
import { sb, clp, esc, fecha, condicionLabel, ESTADO, estadoHTML, placeholderSVG, fotoUrl, fotoHTML, fail, toast, guardarToken, misTokens, ICON, METODOS, aplicarTitulo } from '/src/supabase.js';
import { registrar } from '/src/visitas.js';

aplicarTitulo('Producto');

const id = (location.pathname.match(/^\/p\/(.+)$/)?.[1]) || new URLSearchParams(location.search).get('id');
const cont = document.getElementById('detalle');
document.getElementById('volver').insertAdjacentHTML('afterbegin', ICON.back);

let prod, fotos = [], idx = 0, metodos = [], ajustes = { ofertas_habilitadas: true, ofertas_publicas: true };

async function cargar() {
  if (!id) { cont.innerHTML = '<p class="spinner">Producto no encontrado.</p>'; return; }
  const [{ data: p, error }, { data: f }, { data: m }, { data: st }] = await Promise.all([
    sb.from('catalog').select('*').eq('id', id).single(),
    sb.from('product_photos').select('storage_path,position').eq('product_id', id).order('position'),
    sb.from('payment_options').select('method'),
    sb.from('site_settings').select('key,value'),
  ]);
  if (error || !p) { cont.innerHTML = '<p class="spinner">Producto no encontrado.</p>'; return; }
  (st || []).forEach((r) => { ajustes[r.key] = r.value === true; });
  ajustes.ofertas_habilitadas = p.accepts_offers !== false;   // rige el interruptor del producto
  prod = p; fotos = f || []; metodos = (m || []).map((x) => METODOS[x.method] || x.method);
  document.title = p.title + ' — ' + (window.__tituloSitio || 'Oferta de Muebles y Electrodomésticos');
  pintar();
  if (!vistaRegistrada) { vistaRegistrada = true; registrar('producto', { product_id: id }); }
}
let vistaRegistrada = false;

function metodosTexto() {
  if (!metodos.length) return 'los medios de pago del equipo';
  return metodos.length > 1
    ? metodos.slice(0, -1).join(', ') + ' o ' + metodos.at(-1).toLowerCase()
    : metodos[0];
}

// Medidas: solo las registradas. Ancho × alto × profundidad en una línea, peso aparte.
const fmt = (n) => Number(n).toLocaleString('es-CL', { maximumFractionDigits: 1 });
function medidasHTML(p) {
  const dims = [['Ancho', p.width_cm], ['Alto', p.height_cm], ['Prof.', p.depth_cm]].filter(([, v]) => v != null && v !== '');
  const out = [];
  if (dims.length) out.push(`<div><span class="k">Medidas</span>${dims.map(([k, v]) => `${fmt(v)} cm`).join(' × ')}<span style="color:var(--muted)"> · ${dims.map(([k]) => k.toLowerCase()).join(' × ')}</span></div>`);
  if (p.weight_kg != null && p.weight_kg !== '') out.push(`<div><span class="k">Peso</span>${fmt(p.weight_kg)} kg</div>`);
  return out.join('');
}

function pintar() {
  const p = prod;
  const yaTengo = misTokens().find((t) => t.productId === p.id);
  const foto = fotoUrl(fotos[idx]?.storage_path);
  const n = p.interested_count || 0;

  cont.innerHTML = `<section class="detail">
    <div class="gallery">
      <div class="main">
        ${foto ? fotoHTML(foto, p.title, false) : placeholderSVG(p.category)}
        ${fotos.length > 1 ? `<div class="gal-nav">
          <span class="gal-count">${idx + 1} / ${fotos.length}</span>
          <button type="button" id="foto-prev" aria-label="Foto anterior"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <button type="button" id="foto-next" aria-label="Foto siguiente"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>` : ''}
      </div>
      ${fotos.length > 1 ? `<div class="strip">${fotos.map((f, i) => {
        const u = fotoUrl(f.storage_path);
        return `<button type="button" data-i="${i}" ${i === idx ? 'aria-current="true"' : ''} aria-label="Foto ${i + 1}"><img src="${u}" alt=""></button>`;
      }).join('')}</div>` : ''}
    </div>
    <div style="display:grid;gap:18px;align-content:start;padding-top:6px">
      <span class="kicker">${esc(p.category)}</span>
      <h2>${esc(p.title)}</h2>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span class="price-lg" ${p.status === 'vendido' ? 'style="text-decoration:line-through"' : ''}>${clp(p.price_clp)}</span>
        <span class="pill" style="border:1px solid var(--line);background:transparent"><span class="dot" style="background:${ESTADO[p.status].color}"></span>${ESTADO[p.status].label}</span>
      </div>
      <p style="font-size:15px;line-height:1.65;max-width:52ch;margin:0;color:var(--ink-2)">${esc(p.description).replace(/\n/g, '<br>')}</p>
      <div class="specs">
        <div><span class="k">Retiro</span>${esc(p.lugar || '—')}</div>
        <div><span class="k">Condición</span>${esc(condicionLabel(p.condicion))}</div>
        ${medidasHTML(p)}
        <div><span class="k">Publicado</span>${fecha(p.created_at)}</div>
        ${ajustes.ofertas_habilitadas && ajustes.ofertas_publicas ? `<div><span class="k">Oferta más alta</span>${p.top_offer_clp ? `<strong style="color:var(--accent)">${clp(p.top_offer_clp)}</strong> <span style="color:var(--muted)">· ${p.offer_count} ${p.offer_count === 1 ? 'oferta' : 'ofertas'}</span>` : '<span style="color:var(--muted)">Sin ofertas aún</span>'}</div>` : ''}
      </div>
      <div id="cta" style="display:grid;gap:12px"></div>
    </div>
  </section>`;

  cont.querySelectorAll('.strip button').forEach((b) => b.onclick = () => { idx = +b.dataset.i; pintar(); });
  const mover = (d) => { idx = (idx + d + fotos.length) % fotos.length; pintar(); };
  document.getElementById('foto-prev')?.addEventListener('click', () => mover(-1));
  document.getElementById('foto-next')?.addEventListener('click', () => mover(1));
  // Deslizar con el dedo en la imagen principal.
  const main = cont.querySelector('.gallery .main');
  let x0 = null;
  main.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  main.addEventListener('touchend', (e) => {
    if (x0 === null || fotos.length < 2) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) mover(dx < 0 ? 1 : -1);
  });

  const cta = document.getElementById('cta');
  if (p.status === 'vendido') {
    cta.innerHTML = `<p class="lead">Este producto ya fue vendido. Sigue visible como referencia de precio.</p>`;
  } else if (yaTengo) {
    cta.innerHTML = `<p class="lead">Ya marcaste tu interés en este producto.</p>
      <div><a class="btn btn-primary" href="/c/${esc(yaTengo.token)}">${ICON.chat}Abrir conversación</a></div>`;
  } else {
    cta.innerHTML = `<p class="lead">${n === 0 ? 'Sin interesados aún' : n === 1 ? '1 persona interesada' : n + ' personas interesadas'}. ${ajustes.ofertas_habilitadas
        ? 'Al mostrar tu interés se abre una conversación privada con quien vende para coordinar la reserva.'
        : 'Al marcar interés se abre una conversación privada con quien vende.'}</p>
      <p class="lead" style="display:flex;align-items:center;gap:8px"><span class="icon" style="display:inline-grid;width:15px;height:15px;flex:none;color:var(--accent)">${ICON.card}</span><span>Posibilidad de reservar.</span></p>
      <div><button class="btn btn-primary" id="btn-interes" style="padding:12px 20px;font-size:14px">${ICON.heart}${ajustes.ofertas_habilitadas ? 'Me interesa / ofertar' : 'Me interesa'}</button></div>`;
    document.getElementById('btn-interes').onclick = abrir;
  }
}

const dlg = document.getElementById('dlg-interes');
const form = document.getElementById('form-interes');
document.getElementById('cancelar').onclick = () => dlg.close();

function abrir() {
  document.getElementById('dlg-titulo').textContent = 'Me interesa: ' + prod.title;
  document.getElementById('dlg-bajada').textContent =
    `Precio ${ajustes.ofertas_habilitadas ? 'publicado' : 'fijo'} ${clp(prod.price_clp)}. Déjanos cómo contactarte; la conversación queda abierta en un enlace privado.`;
  form.oferta.closest('label').classList.toggle('hide', !ajustes.ofertas_habilitadas);
  document.getElementById('oferta-hint').textContent = !ajustes.ofertas_publicas
    ? `Precio publicado ${clp(prod.price_clp)}. Si no indicas nada, se toma el precio publicado.`
    : prod.top_offer_clp
    ? `Precio publicado ${clp(prod.price_clp)} · oferta más alta hasta ahora ${clp(prod.top_offer_clp)}. Si no indicas nada, se toma el precio publicado.`
    : `Precio publicado ${clp(prod.price_clp)} · todavía no hay ofertas. Si no indicas nada, se toma el precio publicado.`;
  dlg.showModal();
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true;
  const fd = new FormData(form);
  const oferta = ajustes.ofertas_habilitadas && fd.get('oferta') ? Number(fd.get('oferta')) : null;
  const { data, error } = await sb.rpc('create_interest', {
    p_product: prod.id,
    p_name: fd.get('nombre').trim(),
    p_contact: fd.get('contacto').trim(),
    p_message: (fd.get('mensaje') || '').trim() || null,
    p_offer: oferta,
  });
  btn.disabled = false;
  if (error) return fail(error);

  const token = data;
  registrar('interes', { product_id: prod.id });
  guardarToken(token, prod.title);
  const all = JSON.parse(localStorage.getItem('vh.tokens'));
  all[0].productId = prod.id;
  localStorage.setItem('vh.tokens', JSON.stringify(all));
  dlg.close();
  toast('Registramos tu interés. Te llevamos a tu conversación.');
  setTimeout(() => location.assign('/c/' + token), 900);
};

cargar();
</script>
</body>
</html>

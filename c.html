<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mi conversación — MobVenta</title>
<link rel="icon" type="image/png" href="/src/favicon.png">
<link rel="apple-touch-icon" href="/src/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MobVenta">
<meta property="og:title" content="MobVenta">
<meta property="og:description" content="Venta de muebles, electrodomésticos y electrónica por cambio de casa. Precio publicado y trato directo con quien vende.">
<meta property="og:image" content="https://mobventa.netlify.app/src/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mobventa.netlify.app/src/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/src/app.css?v=17">
<script src="/src/sentry.js"></script>
<script src="https://js-de.sentry-cdn.com/eb8b8ac82e5eef0fc305cb9a2da4a622.min.js" crossorigin="anonymous"></script>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/" aria-label="MobVenta, ir al catálogo"><img src="/src/logo.png" alt="MobVenta — Venta de muebles por cambio de casa"></a>
  <a href="/">Catálogo</a>
  <a href="/mis-conversaciones">Mis conversaciones</a>
</nav>

<main>
  <div id="cont"><p class="spinner">Abriendo tu conversación…</p></div>
</main>

<dialog id="dlg-oferta">
  <form class="sheet" id="form-oferta">
    <div class="title" id="oferta-titulo">Hacer una oferta</div>
    <p id="oferta-bajada"></p>
    <label class="field">Tu oferta (CLP)<input name="monto" type="number" min="1000" step="1000" inputmode="numeric" required placeholder="Ej. 150000"></label>
    <div class="actions">
      <button type="button" class="btn btn-secondary" id="oferta-cancelar">Cancelar</button>
      <button type="submit" class="btn btn-primary">Enviar oferta</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-pago">
  <form class="sheet" id="form-pago">
    <div class="stack">
      <span class="kicker" id="pago-producto"></span>
      <div class="price-lg" id="pago-monto"></div>
    </div>
    <p>Elige cómo pagar, transfiere con los datos que aparecen y avisa el pago. Quien vende lo confirma y el producto queda cerrado a tu nombre.</p>
    <div id="pago-opciones" style="display:grid;gap:10px"></div>
    <label class="field">N° de comprobante o referencia (opcional)<input name="ref" placeholder="Ej. 8842019"></label>
    <div class="actions">
      <button type="button" class="btn btn-secondary" id="pago-cancelar">Cancelar</button>
      <button type="submit" class="btn btn-primary">Ya pagué, avisar</button>
    </div>
  </form>
</dialog>

<script type="module">
import { sb, clp, esc, hora, ESTADO_INTERES, ESTADO_PAGO, estadoHTML, placeholderSVG, fotoUrl, fail, toast, METODOS, ICON, guardarToken, olvidarToken, aplicarTitulo, avisoCorreoHTML } from '/src/supabase.js';

aplicarTitulo('Mi conversación');

const token = (location.pathname.match(/^\/c\/(.+)$/)?.[1]) || new URLSearchParams(location.search).get('t');
const cont = document.getElementById('cont');
let hilo, mensajes = [], cover = null, opciones = [];

async function cargar() {
  if (!token) { cont.innerHTML = '<p class="spinner">Enlace inválido.</p>'; return; }
  const { data, error } = await sb.rpc('thread_by_token', { p_token: token });
  const t = Array.isArray(data) ? data[0] : data;
  if (error || !t) { cont.innerHTML = '<p class="spinner">Este enlace no corresponde a ninguna conversación.</p>'; return; }
  hilo = t;
  guardarToken(token, t.product_title, t.product_id);

  const [{ data: ms }, { data: fs }, { data: op }] = await Promise.all([
    sb.rpc('messages_by_token', { p_token: token }),
    sb.from('product_photos').select('storage_path').eq('product_id', t.product_id).order('position').limit(1),
    sb.rpc('payment_options_by_token', { p_token: token }),
  ]);
  mensajes = ms || [];
  cover = fs?.[0]?.storage_path || null;
  opciones = op || [];
  pintar();
}

function puedeBorrar() {
  if (hilo.interest_status === 'vendido' || hilo.product_status === 'vendido') return false;
  return hilo.payment_status !== 'pagado';
}
async function borrarHilo() {
  const reservado = hilo.interest_status === 'reservado' ? '\n\nTu reserva se libera y el producto vuelve a estar disponible para otras personas.' : '';
  if (!confirm(`¿Borrar tu conversación sobre «${hilo.product_title}»?\n\nSe eliminan tus mensajes y tu oferta, y este enlace deja de funcionar. No se puede deshacer.${reservado}`)) return;
  const { error } = await sb.rpc('delete_thread_by_token', { p_token: token });
  if (error) return fail(error);
  olvidarToken(token);
  toast('Conversación borrada');
  setTimeout(() => location.href = '/mis-conversaciones', 900);
}

function pagoEstado() {
  if (!hilo.payment_status) return hilo.interest_status === 'reservado' ? 'pendiente' : null;
  return hilo.payment_status;
}

function franjaOferta() {
  if (hilo.offers_enabled === false) return '';
  if (hilo.product_status === 'vendido' || hilo.interest_status === 'vendido') return '';
  const top = hilo.top_offer_clp, mia = hilo.my_offer_clp, n = Number(hilo.offer_count || 0);
  const soyTop = mia && top && mia >= top;
  const resumen = top
    ? `Oferta más alta hasta ahora <strong>${clp(top)}</strong> · ${n} ${n === 1 ? 'oferta' : 'ofertas'} · precio publicado ${clp(hilo.price_clp)}.`
    : (top === null && n === 0 && mia) ? `Precio publicado ${clp(hilo.price_clp)}.` : `Todavía no hay ofertas. Precio publicado ${clp(hilo.price_clp)}.`;
  const propia = mia
    ? `Tu oferta: <strong>${clp(mia)}</strong>${top ? (soyTop ? ' — es la más alta.' : ' — hay una oferta mayor.') : '.'}`
    : 'Aún no has ofertado; estás pidiendo el producto al precio publicado.';
  return `
  <div class="note note-plain strip-pay" style="max-width:780px;margin-top:14px">
    <div class="txt">
      <span class="state"><span class="dot" style="background:${soyTop ? 'var(--verde)' : 'var(--accent)'}"></span>Ofertas</span>
      <span style="font-size:13.5px;line-height:1.55;color:var(--ink-2)">${resumen}<br>${propia}</span>
    </div>
    <button class="btn btn-secondary" id="btn-ofertar">${mia ? 'Mejorar mi oferta' : 'Hacer una oferta'}</button>
  </div>`;
}

function franjaPago() {
  const st = pagoEstado();
  if (!st) return '';
  const metodo = hilo.payment_method ? (METODOS[hilo.payment_method] || hilo.payment_method) : null;
  const ref = hilo.payment_reference ? ` · ref. ${esc(hilo.payment_reference)}` : '';
  if (st === 'pagado') {
    return franja('note-ok', 'var(--verde)', 'Pago confirmado',
      `${clp(hilo.price_clp)} por ${esc(metodo)}${ref}. El producto quedó cerrado a tu nombre.`);
  }
  if (st === 'porconfirmar') {
    return franja('note-warn', 'var(--ambar)', 'Pago avisado',
      `Avisaste el pago por ${esc(metodo)}${ref}. Falta que quien vende lo confirme.`);
  }
  return franja('note-ok', 'var(--accent)', 'Reserva confirmada',
    `Paga ${clp(hilo.price_clp)} para cerrar la entrega.`,
    `<button class="btn btn-primary" id="btn-pagar">${ICON.card}Pagar ${clp(hilo.price_clp)}</button>`);
}

const franja = (cls, dot, title, body, cta = '') => `
  <div class="note ${cls} strip-pay" style="max-width:780px;margin-top:14px">
    <div class="txt">
      <span class="state" style="color:inherit"><span class="dot" style="background:${dot}"></span>${title}</span>
      <span style="font-size:13.5px;line-height:1.55;color:var(--ink-2)">${body}</span>
    </div>${cta}
  </div>`;

function pintar() {
  const foto = fotoUrl(cover);
  // El sondeo periódico vuelve a pintar todo: conservar lo que la persona escribe, el foco y su posición de lectura.
  const prevInput = document.querySelector('#form-msg input[name=body]');
  const borrador = prevInput?.value || '';
  const teniaFoco = !!prevInput && document.activeElement === prevInput;
  const prevLog = document.getElementById('log');
  const estabaAbajo = !prevLog || (prevLog.scrollHeight - prevLog.scrollTop - prevLog.clientHeight) < 40;
  const scrollPrevio = prevLog?.scrollTop || 0;
  cont.innerHTML = `
    <div style="padding-top:20px"><a class="btn btn-ghost" href="/p/${hilo.product_id}">${ICON.back}Ver el producto</a></div>
    ${hilo.interest_status === 'descartado' ? '' : `<div style="max-width:780px;margin-top:16px">${avisoCorreoHTML()}</div>`}
    <section class="chat" style="margin-top:16px">
      <header>
        ${foto ? `<img class="mini" src="${foto}" alt="">` : `<div class="mini"></div>`}
        <div style="flex:1;min-width:160px">
          <div style="font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2">${esc(hilo.product_title)}</div>
          <div class="sub" style="font-size:12.5px;color:var(--muted)">${clp(hilo.price_clp)}</div>
        </div>
        ${estadoHTML(ESTADO_INTERES, hilo.interest_status)}
      </header>
      <div class="log" id="log">
        <p class="sys">Conversación privada entre ${esc(hilo.buyer_name)} y el equipo de venta sobre este producto.</p>
        ${mensajes.map((m) => `
          <div class="msg ${m.sender === 'interesado' ? 'mine' : ''}">
            <div class="bubble">${esc(m.body)}</div>
            <span class="when">${m.sender === 'interesado' ? esc(hilo.buyer_name.split(' ')[0]) : 'Equipo de venta'} · ${hora(m.created_at)}</span>
          </div>`).join('')}
      </div>
      ${hilo.interest_status === 'descartado'
        ? `<p class="sys" style="padding:12px;border-top:1px solid var(--line);margin:0">El equipo de venta cerró esta conversación. Puedes seguir viendo el catálogo.</p>`
        : `<form id="form-msg">
        <input name="body" placeholder="Escribe un mensaje…" aria-label="Mensaje" autocomplete="off" required>
        <button type="submit" aria-label="Enviar">${ICON.send}</button>
      </form>`}
    </section>
    ${hilo.interest_status === 'descartado' ? '' : franjaOferta() + franjaPago()}
    ${puedeBorrar() ? `<p class="lead" style="font-size:12.5px;margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><span style="margin-right:auto">¿Ya no te interesa? Puedes cerrar y borrar esta conversación.</span><button type="button" class="btn btn-ghost btn-danger" id="btn-borrar-hilo" style="font-size:12.5px">${ICON.trash}Borrar conversación</button></p>` : ''}`;

  document.getElementById('btn-borrar-hilo')?.addEventListener('click', borrarHilo);

  const log = document.getElementById('log');
  log.scrollTop = estabaAbajo ? log.scrollHeight : scrollPrevio;
  const input = document.querySelector('#form-msg input[name=body]');
  if (input && borrador) input.value = borrador;
  if (input && teniaFoco) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  document.getElementById('btn-pagar')?.addEventListener('click', abrirPago);
  document.getElementById('btn-ofertar')?.addEventListener('click', abrirOferta);

  document.getElementById('form-msg')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = e.target.body;
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    const { error } = await sb.rpc('send_message_by_token', { p_token: token, p_body: body });
    if (error) return fail(error);
    cargar();
  });
}

const dlgOferta = document.getElementById('dlg-oferta');
document.getElementById('oferta-cancelar').onclick = () => dlgOferta.close();

function abrirOferta() {
  const f = document.getElementById('form-oferta');
  f.monto.value = hilo.my_offer_clp || '';
  f.monto.min = hilo.my_offer_clp ? hilo.my_offer_clp + 1000 : 1000;
  document.getElementById('oferta-titulo').textContent = hilo.my_offer_clp ? 'Mejorar mi oferta' : 'Hacer una oferta';
  document.getElementById('oferta-bajada').textContent =
    `${hilo.product_title} · precio publicado ${clp(hilo.price_clp)}` +
    (hilo.top_offer_clp ? ` · oferta más alta ${clp(hilo.top_offer_clp)}.` : ' · sin ofertas todavía.') +
    ' Quien vende decide a quién reservar; la oferta más alta se muestra públicamente sin tu nombre.';
  dlgOferta.showModal();
}

document.getElementById('form-oferta').onsubmit = async (e) => {
  e.preventDefault();
  const monto = Number(new FormData(e.target).get('monto'));
  if (hilo.my_offer_clp && monto <= hilo.my_offer_clp) return toast('La nueva oferta debe superar la tuya actual');
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled = true;
  const { error } = await sb.rpc('place_offer_by_token', { p_token: token, p_amount: monto });
  btn.disabled = false;
  if (error) return fail(error);
  dlgOferta.close();
  toast('Oferta enviada');
  cargar();
};

const dlg = document.getElementById('dlg-pago');
document.getElementById('pago-cancelar').onclick = () => dlg.close();

function abrirPago() {
  document.getElementById('pago-producto').textContent = hilo.product_title;
  document.getElementById('pago-monto').textContent = clp(hilo.price_clp);
  document.getElementById('pago-opciones').innerHTML = opciones.map((o, i) => `
    <label class="choice">
      <span class="head">
        <input type="radio" name="metodo" value="${esc(o.method)}" ${i === 0 ? 'checked' : ''}>
        <span class="mark"></span>
        <span class="stack"><b>${esc(METODOS[o.method] || o.method)}</b></span>
      </span>
      <span class="data">${Object.entries(o.details || {}).map(([k, v]) =>
        `<div><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</span>
    </label>`).join('') || '<p class="lead">El equipo todavía no publicó sus datos de cobro. Pregúntale por el chat.</p>';
  dlg.showModal();
}

document.getElementById('form-pago').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled = true;
  const { error } = await sb.rpc('declare_payment_by_token', {
    p_token: token,
    p_method: fd.get('metodo'),
    p_reference: (fd.get('ref') || '').trim() || null,
  });
  btn.disabled = false;
  if (error) return fail(error);
  dlg.close();
  toast('Pago avisado. Queda por confirmar.');
  cargar();
};

cargar();
setInterval(cargar, 20000);
</script>
</body>
</html>
